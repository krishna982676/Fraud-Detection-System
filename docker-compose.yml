version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelx-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m
      - FRAUD_DETECTION_THRESHOLD=0.70
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
